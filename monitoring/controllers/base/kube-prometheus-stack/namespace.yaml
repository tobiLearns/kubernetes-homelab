apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    # baseline PSA blocks node-exporter, which needs hostNetwork, hostPID,
    # hostPath (/proc, /sys, /) and hostPort to read host-level metrics.
    # Namespace-wide exemption since PSA has no per-workload granularity;
    # only node-exporter needs this, not grafana/prometheus/alertmanager.
    pod-security.kubernetes.io/enforce: privileged

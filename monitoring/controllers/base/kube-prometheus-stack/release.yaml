apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "82.x"

      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  values:
    grafana:
      adminPassword: mischa
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - grafana.homelab.net
        tls:
          - secretName: grafana-tls-secret
            hosts:
              - grafana.homelab.net

    # node-exporter needs host access, so it runs as its own release in a
    # dedicated privileged namespace (see ../prometheus-node-exporter) instead of here:
    nodeExporter:
      enabled: false

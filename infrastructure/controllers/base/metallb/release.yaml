apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 30m
  chart:
    spec:
      chart: metallb
      version: "0.16.x"

      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: metallb-system
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    # FRR-K8s is MetalLB's BGP backend (enabled by default).
    # It is only needed if MetalLB runs in 'BGP mode'.
    # The current MetalLB installation is configured to use L2Advertisement,
    # so FRR-K8s can be disabled:
    frrk8s:
      enabled: false
    speaker:
      # Kubernetes automatically labels control-plane nodes 'node.kubernetes.io/exclude-from-external-load-balancers'
      # (standard behavior since 1.22, meant to keep external LB traffic off control-plane nodes in a normal multi-node cluster)
      # On a one node cluster, this label has to be ignored:
      ignoreExcludeLB: true


apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
  labels:
    # baseline PSA blocks MetalLB's speaker DaemonSet, which needs
    # hostNetwork + the NET_RAW capability to send raw ARP replies on the
    # real network interface (confirmed against MetalLB's own manifests).
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

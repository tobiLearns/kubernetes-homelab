apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
  labels:
    # Talos enforces the PSA 'baseline' profile. That would block MetalLB's speaker DaemonSet,
    # which needs hostNetwork + the NET_RAW capability to send raw ARP replies on the
    # real network interface (confirmed against MetalLB's own manifests),
    # and host ports for its memberlist.
    # Allowlist for this label: infrastructure/configs/base/kyverno/guard-privileged-namespaces.yaml
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

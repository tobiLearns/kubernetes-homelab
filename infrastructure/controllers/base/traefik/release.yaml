apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m
  chart:
    spec:
      chart: traefik
      version: "41.x"

      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    # TEMPORARY: single-node cluster, no LoadBalancer (e.g. MetalLB) installed yet.
    # Bind the entrypoints directly to this node's ports 80/443 via hostPort as a
    # stand-in for a real LoadBalancer IP. Revisit once a second node is added —
    # switch to MetalLB (+ service.type: LoadBalancer) for a stable virtual IP
    # and failover across nodes.
    ports:
      web:
        hostPort: 80
      websecure:
        hostPort: 443
    service:
      spec:
        type: ClusterIP
    ingressClass:
      enabled: true
      isDefaultClass: true
      name: traefik
